name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: 'True'
          DB_NAME: taskdb
          DB_USER: taskuser
          DB_PASSWORD: taskpass123
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost
          DJANGO_SETTINGS_MODULE: taskmanager.settings
        run: pytest tasks/tests.py -v --override-ini="DJANGO_SETTINGS_MODULE=taskmanager.settings"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest,${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
